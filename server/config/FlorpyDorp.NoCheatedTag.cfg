## Settings file was created by plugin NoCheatedTag v1.0.1
## Plugin GUID: FlorpyDorp.NoCheatedTag

[Character]

## Also clear the character file's permanent 'this character used cheats' marker when the character is loaded (it disables achievements). Off by default: the item tag does not depend on it. The game has its own switch for achievements: the console command 'yesiuseddevcommandsbutiwantmyachievementsanyway 1'.
# Setting type: Boolean
# Default value: false
ResetCharacterUsedCheats = false

[Items]

## Clear the cheated bit on every item as it is read (inventories, chests you open, items on the ground) and before it is written. This is what fixes a character save: load the character with the mod, and its next save is clean.
# Setting type: Boolean
# Default value: true
CleanItemsOnLoadAndSave = true

## Stop the game from marking anything new, items or objects: crafting from marked materials or at marked stations, smelting, cooking, fermenting, creature and piece drops, spawned items and creatures, no-cost pieces, hits in god mode.
# Setting type: Boolean
# Default value: true
PreventNewMarks = true

## Never show the 'summoned through cheating means' line in item tooltips (it cannot appear anyway once items are clean; this covers items held in memory by other mods).
# Setting type: Boolean
# Default value: true
HideTooltipLine = true

[World]

## Server / host: right after the world is loaded, clear the cheated bit in every stored item record and remove the cheated marker from every object. Written to disk with the next world save.
# Setting type: Boolean
# Default value: true
CleanWorldOnLoad = true

